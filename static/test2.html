<!DOCTYPE html>
<html>
<body>
  <input id="msg" placeholder="enter a prompt" />
  <button onclick="send()" palceholder = "genarate" >Send</button>
  <pre id="log"></pre>
  <img id="result-img" src="" style="display:none; max-width:500px;" />

  <script>
    const ws = new WebSocket("ws://10.194.75.127:8000/ws");
    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        const img = document.getElementById("result-img");
        img.src = data.url;
        img.style.display = "block";
    };
    function send() {
      ws.send(document.getElementById("msg").value);
    }
  </script>
</body>
</html>
