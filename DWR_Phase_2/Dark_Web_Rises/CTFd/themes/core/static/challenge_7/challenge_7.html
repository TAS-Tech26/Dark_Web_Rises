<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shredded Plate</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../dwr-theme.css">

  <style>
    /* ================================================================
       PUZZLE-CRITICAL — DO NOT CHANGE
       ----------------------------------------------------------------
       The board is 600x800 split 3 columns x 6 rows. The script computes
       each piece's background-position from those exact numbers
       (boardWidth/cols, boardHeight/rows) and matches them against the
       CSS grid. Change the board size, the column count or the row count
       here without changing the script and every piece renders the wrong
       slice of the image.

       .modal-overlay must start display:none -- the script adds .active
       to show it. A visible overlay gives away the secret message before
       the puzzle is solved.
       ================================================================ */
    :root {
      --board-width: 600px;
      --board-height: 800px;
      --piece-width: 200px;     /* 600px / 3 cols */
      --piece-height: 133.33px; /* 800px / 6 rows */
    }

    #puzzle-board {
      width: var(--board-width);
      height: var(--board-height);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(6, 1fr);
    }

    .slot {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .piece {
      width: 100%;
      height: 100%;
      cursor: grab;
      box-sizing: border-box;
      user-select: none;
    }

    .piece:active { cursor: grabbing; opacity: 0.8; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active { display: flex; }
    /* =============== END PUZZLE-CRITICAL =========================== */

    /* ---------------- chrome ---------------- */

    .board-wrap { display: flex; justify-content: center; }

    #puzzle-board {
      border: 2px solid color-mix(in oklab, var(--neon) 45%, var(--border));
      border-radius: var(--radius);
      background-color: var(--background);
      box-shadow: 0 0 40px color-mix(in oklab, var(--neon) 14%, transparent);
      overflow: hidden;
    }

    .slot { border: 1px dashed color-mix(in oklab, var(--neon) 12%, transparent); }

    .piece { border: 1px solid color-mix(in oklab, var(--foreground) 10%, transparent); }

    #trigger-container {
      margin-top: 26px;
      min-height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* The reveal button, on-theme but keeping its pulse. */
    .glowing-btn {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      padding: 14px 30px;
      color: var(--neon-foreground);
      background-color: var(--neon);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      animation: pulse 1.8s infinite alternate;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .glowing-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 28px color-mix(in oklab, var(--neon) 70%, transparent),
                  0 0 56px color-mix(in oklab, var(--neon) 40%, transparent);
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 12px color-mix(in oklab, var(--neon) 50%, transparent); }
      100% { box-shadow: 0 0 28px color-mix(in oklab, var(--neon) 70%, transparent),
                         0 0 50px color-mix(in oklab, var(--neon) 35%, transparent); }
    }

    .modal-overlay {
      background-color: color-mix(in oklab, var(--background) 85%, transparent);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* The recovered note. Deliberately still paper-coloured -- it is a
       physical artefact inside the fiction, and the contrast against the
       terminal is the point. */
    .paper-note {
      position: relative;
      width: 90%;
      max-width: 460px;
      background: #fdf6e2;
      color: #2b2b2b;
      padding: 40px 30px 30px;
      border-radius: 4px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), inset 0 0 50px rgba(210, 180, 140, 0.4);
      border: 1px solid #d4c5a9;
      transform: scale(0.7);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    }

    .modal-overlay.active .paper-note { transform: scale(1); opacity: 1; }

    .paper-content {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      line-height: 1.6;
      text-align: center;
      color: #3d2b1f;
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 14px;
      background: none;
      border: none;
      font-size: 1.6rem;
      line-height: 1;
      color: #8b5a2b;
      cursor: pointer;
      padding: 0;
    }
  </style>
</head>
<body>

  <div class="dwr-shell" style="max-width:640px;">

    <div class="dwr-header">
      <div class="dwr-eyebrow">// evidence lab</div>
      <h1>Shredded <span class="dwr-accent">Plate</span></h1>
    </div>

  </div>

  <div class="board-wrap">
    <div id="puzzle-board"></div>
  </div>

  <div id="trigger-container"></div>

  <!-- Paper Modal -->
  <div id="paper-modal" class="modal-overlay">
    <div class="paper-note">
      <button class="close-btn" id="close-modal">&times;</button>
      <div class="paper-content">
        <!-- REPLACE YOUR MESSAGE HERE -->
        <h3 style="margin-top: 0; color: #8b5a2b; font-family: Georgia, serif;">A Secret Unlocked!</h3>
        <p>The Raven Watched From The East</p>
        <!-- --------------------------- -->
      </div>
    </div>
  </div>

  <script>
    /* ================================================================
       PUZZLE-CRITICAL — logic below is unchanged from the original.
       The 600x800 / 3x6 constants must match the CSS grid above.
       ================================================================ */
    const imageUrl = 'transylvania_jigsaw.png';

    const rows = 6;
    const cols = 3;
    const totalPieces = rows * cols; // 18 pieces

    const boardWidth = 600;
    const boardHeight = 800;
    const pieceW = boardWidth / cols;  // 200px
    const pieceH = boardHeight / rows; // 133.33px

    const board = document.getElementById('puzzle-board');
    const triggerContainer = document.getElementById('trigger-container');
    const modal = document.getElementById('paper-modal');
    const closeModalBtn = document.getElementById('close-modal');

    // 1. Create linear original indices and shuffle them
    const originalIndices = Array.from({ length: totalPieces }, (_, i) => i);
    let shuffledIndices = [...originalIndices];

    do {
      shuffledIndices.sort(() => Math.random() - 0.5);
    } while (shuffledIndices.every((val, index) => val === index));

    // 2. Build 18 grid slots
    for (let slotIdx = 0; slotIdx < totalPieces; slotIdx++) {
      const slot = document.createElement('div');
      slot.classList.add('slot');
      slot.dataset.slotIndex = slotIdx;

      slot.addEventListener('dragover', (e) => e.preventDefault());
      slot.addEventListener('drop', handleDrop);

      const pieceOriginalIndex = shuffledIndices[slotIdx];
      const piece = createPiece(pieceOriginalIndex);
      slot.appendChild(piece);

      board.appendChild(slot);
    }

    function createPiece(originalIndex) {
      const piece = document.createElement('div');
      piece.classList.add('piece');
      piece.draggable = true;
      piece.dataset.originalIndex = originalIndex;

      const col = originalIndex % cols;
      const row = Math.floor(originalIndex / cols);

      const posX = col * pieceW;
      const posY = row * pieceH;

      piece.style.backgroundImage = `url("${imageUrl}")`;
      piece.style.backgroundSize = `${boardWidth}px ${boardHeight}px`;
      piece.style.backgroundPosition = `-${posX}px -${posY}px`;

      piece.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', slotOfPiece(piece));
      });

      return piece;
    }

    function slotOfPiece(pieceElement) {
      return pieceElement.parentElement.dataset.slotIndex;
    }

    function handleDrop(e) {
      e.preventDefault();

      let targetSlot = e.target;
      if (!targetSlot.classList.contains('slot')) {
        targetSlot = targetSlot.parentElement;
      }
      if (!targetSlot || !targetSlot.classList.contains('slot')) return;

      const sourceSlotIndex = e.dataTransfer.getData('text/plain');
      const targetSlotIndex = targetSlot.dataset.slotIndex;

      if (sourceSlotIndex === targetSlotIndex) return;

      const sourceSlot = document.querySelector(`.slot[data-slot-index="${sourceSlotIndex}"]`);

      const sourcePiece = sourceSlot.firstElementChild;
      const targetPiece = targetSlot.firstElementChild;

      sourceSlot.appendChild(targetPiece);
      targetSlot.appendChild(sourcePiece);

      checkWinCondition();
    }

    function checkWinCondition() {
      const slots = document.querySelectorAll('.slot');
      let isSolved = true;

      slots.forEach(slot => {
        const slotIdx = slot.dataset.slotIndex;
        const pieceIdx = slot.firstElementChild.dataset.originalIndex;
        if (slotIdx !== pieceIdx) {
          isSolved = false;
        }
      });

      if (isSolved && !document.getElementById('reveal-btn')) {
        // Create glowing area when complete
        const glowBtn = document.createElement('button');
        glowBtn.id = 'reveal-btn';
        glowBtn.classList.add('glowing-btn');
        glowBtn.textContent = 'Open Secret Message';
        glowBtn.addEventListener('click', () => {
          modal.classList.add('active');
        });

        triggerContainer.appendChild(glowBtn);
      } else if (!isSolved && document.getElementById('reveal-btn')) {
        // Remove if user moves a piece after completion
        triggerContainer.innerHTML = '';
      }
    }

    // Modal close controls
    closeModalBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
      }
    });
  </script>
</body>
</html>
