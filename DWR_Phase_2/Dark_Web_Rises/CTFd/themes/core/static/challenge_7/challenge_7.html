<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shredded Plate</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../dwr-theme.css">

  <style>
    /* ================================================================
       PUZZLE-CRITICAL — DO NOT CHANGE
       ----------------------------------------------------------------
       The board takes its size FROM THE IMAGE, at runtime. The script
       reads naturalWidth/naturalHeight once the image has loaded, fits
       that to the viewport preserving aspect ratio, and writes the
       result into --board-width / --board-height. Swapping the image
       for one of any other shape needs no change here.

       Nothing sets a fixed pixel size any more. The old values (1100x825)
       happened to match raven.jpeg exactly, which hid the real bug below.
       ================================================================ */
    #puzzle-board {
      width: var(--board-width, 1100px);
      height: var(--board-height, 825px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);

      /* THE SQUASH FIX.
         #puzzle-board is a flex item inside .board-wrap, and flex items
         have flex-shrink: 1 by default. On any viewport narrower than the
         board, width was compressed while height stayed put -- so the
         picture was squashed horizontally AND every piece showed the wrong
         crop, because background-size stayed at the uncompressed figure.
         flex-shrink: 0 makes .board-wrap's overflow-x scroll instead. */
      flex: 0 0 auto;
    }

    .slot {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .piece {
      width: 100%;
      height: 100%;
      cursor: grab;
      box-sizing: border-box;
      user-select: none;
    }

    .piece:active { cursor: grabbing; opacity: 0.8; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active { display: flex; }
    /* =============== END PUZZLE-CRITICAL =========================== */

    /* ---------------- chrome ---------------- */

    .board-wrap { 
      display: flex; 
      justify-content: center; 
      overflow-x: auto;
      padding: 10px;
    }

    #puzzle-board {
      border: 2px solid color-mix(in oklab, var(--neon) 45%, var(--border));
      border-radius: var(--radius);
      background-color: var(--background);
      box-shadow: 0 0 40px color-mix(in oklab, var(--neon) 14%, transparent);
      overflow: hidden;
    }

    .slot { border: 1px dashed color-mix(in oklab, var(--neon) 12%, transparent); }

    .piece { border: 1px solid color-mix(in oklab, var(--foreground) 10%, transparent); }

    #trigger-container {
      margin-top: 26px;
      min-height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* The reveal button, on-theme but keeping its pulse. */
    .glowing-btn {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      padding: 14px 30px;
      color: var(--neon-foreground);
      background-color: var(--neon);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      animation: pulse 1.8s infinite alternate;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .glowing-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 28px color-mix(in oklab, var(--neon) 70%, transparent),
                  0 0 56px color-mix(in oklab, var(--neon) 40%, transparent);
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 12px color-mix(in oklab, var(--neon) 50%, transparent); }
      100% { box-shadow: 0 0 28px color-mix(in oklab, var(--neon) 70%, transparent),
                         0 0 50px color-mix(in oklab, var(--neon) 35%, transparent); }
    }

    .modal-overlay {
      background-color: color-mix(in oklab, var(--background) 85%, transparent);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .paper-note {
      position: relative;
      width: 90%;
      max-width: 460px;
      background: #fdf6e2;
      color: #2b2b2b;
      padding: 40px 30px 30px;
      border-radius: 4px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), inset 0 0 50px rgba(210, 180, 140, 0.4);
      border: 1px solid #d4c5a9;
      transform: scale(0.7);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    }

    .modal-overlay.active .paper-note { transform: scale(1); opacity: 1; }

    .paper-content {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      line-height: 1.6;
      text-align: center;
      color: #3d2b1f;
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 14px;
      background: none;
      border: none;
      font-size: 1.6rem;
      line-height: 1;
      color: #8b5a2b;
      cursor: pointer;
      padding: 0;
    }

    .flag-format {
      margin-top: 16px;
      font-weight: 600;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="dwr-shell" style="max-width:1100px;">

    <div class="dwr-header">
      <div class="dwr-eyebrow">// evidence lab</div>
      <h1>Shredded <span class="dwr-accent">Plate</span></h1>
    </div>

    <!-- Briefing Panel -->
    <div class="dwr-panel dwr-panel--elevated" style="margin-bottom: 24px;">
      <h2>Mission Briefing</h2>
      <p class="dwr-muted">
        [ Briefing details will be populated here. Insert operational parameters, challenge constraints, or additional intel for the player. ]
      </p>

      <div class="dwr-note dwr-note--warn flag-format">
        Flag Format: <span class="dwr-accent">ctf{your_answer}</span>
      </div>
    </div>

  </div>

  <div class="board-wrap">
    <div id="puzzle-board"></div>
  </div>

  <div id="trigger-container"></div>

  <!-- Paper Modal -->
  <div id="paper-modal" class="modal-overlay">
    <div class="paper-note">
      <button class="close-btn" id="close-modal">&times;</button>
      <div class="paper-content" id="paper-content-container">
        <!-- Content dynamically injected upon verification -->
      </div>
    </div>
  </div>

  <script>
    /* ================================================================
       PUZZLE LOGIC — 4 cols x 3 rows (1100x825px)
       ================================================================ */
    const imageUrl = 'raven.jpeg';
    const secretMessage = "The Raven Watched From The East";

    const rows = 3;
    const cols = 4;
    const totalPieces = rows * cols; // 12 pieces

    /* Board size comes from the image, not the other way round.
       Filled in by sizeBoardToImage() once the image has loaded. */
    let boardWidth = 0;
    let boardHeight = 0;
    let pieceW = 0;
    let pieceH = 0;

    const board = document.getElementById('puzzle-board');
    const triggerContainer = document.getElementById('trigger-container');
    const modal = document.getElementById('paper-modal');
    const closeModalBtn = document.getElementById('close-modal');
    const paperContentContainer = document.getElementById('paper-content-container');

    /* Fit the image's own proportions into the space available.
       Returns whole pixels divisible by cols/rows: a fractional piece size
       leaves hairline seams between pieces and, worse, makes the
       background offsets drift by a pixel or two per column so a correctly
       placed piece looks very slightly wrong. */
    function sizeBoardToImage(natW, natH) {
      const aspect = natW / natH;

      // Never upscale past the source -- an enlarged JPEG just looks soft.
      // 32px of slack keeps it clear of .board-wrap's padding and any
      // scrollbar the wrapper puts up.
      const availW = Math.min(natW, (board.parentElement.clientWidth || natW) - 32);
      // Leave room for the header and the reveal button so the whole board
      // is on screen at once; a puzzle you have to scroll to see is a
      // puzzle you cannot solve.
      const availH = Math.min(natH, window.innerHeight * 0.72);

      let w = Math.max(cols, availW);
      let h = w / aspect;
      if (h > availH) {
        h = availH;
        w = h * aspect;
      }

      boardWidth  = Math.max(cols, Math.floor(w / cols) * cols);
      boardHeight = Math.max(rows, Math.floor(h / rows) * rows);
      pieceW = boardWidth / cols;
      pieceH = boardHeight / rows;

      board.style.setProperty('--board-width', boardWidth + 'px');
      board.style.setProperty('--board-height', boardHeight + 'px');
    }

    /* Re-apply sizing to pieces already on the board. Restyle only: the
       DOM order is untouched, so a half-solved puzzle survives a window
       resize or a phone rotating. */
    function repaintPieces() {
      document.querySelectorAll('.piece').forEach(piece => {
        const originalIndex = parseInt(piece.dataset.originalIndex, 10);
        const col = originalIndex % cols;
        const row = Math.floor(originalIndex / cols);
        piece.style.backgroundSize = `${boardWidth}px ${boardHeight}px`;
        piece.style.backgroundPosition = `-${col * pieceW}px -${row * pieceH}px`;
      });
    }

    // 1. Create linear original indices and shuffle them
    const originalIndices = Array.from({ length: totalPieces }, (_, i) => i);
    let shuffledIndices = [...originalIndices];

    do {
      shuffledIndices.sort(() => Math.random() - 0.5);
    } while (shuffledIndices.every((val, index) => val === index));

    // 2. Build 12 grid slots
    function buildBoard() {
    for (let slotIdx = 0; slotIdx < totalPieces; slotIdx++) {
      const slot = document.createElement('div');
      slot.classList.add('slot');
      slot.dataset.slotIndex = slotIdx;

      slot.addEventListener('dragover', (e) => e.preventDefault());
      slot.addEventListener('drop', handleDrop);

      const pieceOriginalIndex = shuffledIndices[slotIdx];
      const piece = createPiece(pieceOriginalIndex);
      slot.appendChild(piece);

      board.appendChild(slot);
    }
    }

    /* Measure first, then build. Reading naturalWidth before the image has
       loaded returns 0, which would size every piece to nothing. */
    const sourceImage = new Image();
    sourceImage.onload = () => {
      sizeBoardToImage(sourceImage.naturalWidth, sourceImage.naturalHeight);
      buildBoard();
    };
    sourceImage.onerror = () => {
      // Say so rather than presenting an empty grid the player cannot solve.
      board.style.setProperty('--board-width', '100%');
      board.style.setProperty('--board-height', 'auto');
      board.innerHTML =
        '<p style="padding:40px;text-align:center;font-family:var(--font-mono);">' +
        'Could not load ' + imageUrl + '. Tell an organiser.</p>';
    };
    sourceImage.src = imageUrl;

    /* Rotating a phone changes the space available. Recompute and restyle;
       do not rebuild, or the player loses their progress. */
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (!sourceImage.naturalWidth) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        sizeBoardToImage(sourceImage.naturalWidth, sourceImage.naturalHeight);
        repaintPieces();
      }, 150);
    });

    function createPiece(originalIndex) {
      const piece = document.createElement('div');
      piece.classList.add('piece');
      piece.draggable = true;
      piece.dataset.originalIndex = originalIndex;

      const col = originalIndex % cols;
      const row = Math.floor(originalIndex / cols);

      const posX = col * pieceW;
      const posY = row * pieceH;

      piece.style.backgroundImage = `url("${imageUrl}")`;
      piece.style.backgroundSize = `${boardWidth}px ${boardHeight}px`;
      piece.style.backgroundPosition = `-${posX}px -${posY}px`;

      piece.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', slotOfPiece(piece));
      });

      return piece;
    }

    function slotOfPiece(pieceElement) {
      return pieceElement.parentElement.dataset.slotIndex;
    }

    function handleDrop(e) {
      e.preventDefault();

      let targetSlot = e.target;
      if (!targetSlot.classList.contains('slot')) {
        targetSlot = targetSlot.parentElement;
      }
      if (!targetSlot || !targetSlot.classList.contains('slot')) return;

      const sourceSlotIndex = e.dataTransfer.getData('text/plain');
      const targetSlotIndex = targetSlot.dataset.slotIndex;

      if (!sourceSlotIndex || sourceSlotIndex === targetSlotIndex) return;

      const sourceSlot = document.querySelector(`.slot[data-slot-index="${sourceSlotIndex}"]`);
      if (!sourceSlot) return;

      const sourcePiece = sourceSlot.firstElementChild;
      const targetPiece = targetSlot.firstElementChild;

      sourceSlot.appendChild(targetPiece);
      targetSlot.appendChild(sourcePiece);

      checkWinCondition();
    }

    function checkWinCondition() {
      const slots = document.querySelectorAll('.slot');
      let isSolved = true;

      slots.forEach(slot => {
        const slotIdx = parseInt(slot.dataset.slotIndex, 10);
        const pieceIdx = parseInt(slot.firstElementChild.dataset.originalIndex, 10);
        if (slotIdx !== pieceIdx) {
          isSolved = false;
        }
      });

      if (isSolved) {
        // Automatically reveal modal & inject flag content
        paperContentContainer.innerHTML = `
          <h3 style="margin-top: 0; color: #8b5a2b; font-family: Georgia, serif;">A Secret Unlocked!</h3>
          <p>${secretMessage}</p>
        `;
        
        if (!document.getElementById('reveal-btn')) {
          const glowBtn = document.createElement('button');
          glowBtn.id = 'reveal-btn';
          glowBtn.classList.add('glowing-btn');
          glowBtn.textContent = 'Open Secret Message';
          glowBtn.addEventListener('click', () => {
            modal.classList.add('active');
          });
          triggerContainer.appendChild(glowBtn);
        }

        modal.classList.add('active');
      } else {
        triggerContainer.innerHTML = '';
        paperContentContainer.innerHTML = '';
        modal.classList.remove('active');
      }
    }

    closeModalBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
      }
    });
  </script>
</body>
</html>
