<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Standings — Dark Web Rises</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../dwr-theme.css">

  <style>
    /* No puzzle logic here, but the element IDs below are contractual:
       final_leaderboard.py writes scores.json next to this file and the
       script populates #phase1-body, #ctf-body, #combined-body and
       #generated. The error path replaces #boards. Renaming any of them
       breaks the winner reveal. */

    .leaderboard-container {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      justify-content: center;
      align-items: flex-start;
    }

    .board {
      flex: 1;
      min-width: 300px;
      max-width: 440px;
    }

    .board h2 {
      text-align: center;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding-bottom: 12px;
      margin-bottom: 4px;
      border-bottom: 1px solid color-mix(in oklab, var(--neon) 40%, var(--border));
    }

    .generated {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted-foreground);
      margin: 0 0 34px;
    }

    .page-head { text-align: center; margin-bottom: 8px; }

    .rank {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--neon);
      width: 46px;
    }

    .team-name { font-weight: 600; }

    td:not(.team-name) { font-family: var(--font-mono); font-size: 13px; }

    .final-score { color: var(--neon); font-weight: 700; }

    .no-data { text-align: center; color: var(--muted-foreground); }

    .error {
      max-width: 700px;
      margin: 30px auto;
      text-align: center;
    }

    .error code { color: var(--warning); }
  </style>
</head>
<body>

  <div class="dwr-shell">

    <div class="page-head">
      <div class="dwr-eyebrow">// operation complete</div>
      <h1>Final <span class="dwr-accent">Standings</span></h1>
    </div>

    <p class="generated" id="generated"></p>

    <div class="leaderboard-container" id="boards">

      <!-- Phase 1 Board -->
      <div class="board dwr-panel">
        <h2>Phase 1</h2>
        <table class="dwr-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Team</th>
              <th>Raw</th>
              <th>Norm</th>
            </tr>
          </thead>
          <tbody id="phase1-body">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
      </div>

      <!-- CTFd Board -->
      <div class="board dwr-panel">
        <h2>CTF Phase</h2>
        <table class="dwr-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Team</th>
              <th>Raw</th>
              <th>Norm</th>
            </tr>
          </thead>
          <tbody id="ctf-body">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
      </div>

      <!-- Final Combined Board -->
      <div class="board dwr-panel dwr-panel--neon">
        <h2 class="dwr-accent">Combined Overall</h2>
        <table class="dwr-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Team</th>
              <th>Final Score</th>
            </tr>
          </thead>
          <tbody id="combined-body">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Written next to this file by scripts/final_leaderboard.py. Relative so
    // it works regardless of the host the CTF is served from.
    // Cache-busted: without it a browser that loaded the page mid-event will
    // happily serve a stale scores.json from cache after the rerun.
    const score_path = "scores.json?t=" + Date.now();

    fetch(score_path)
      .then(response => {
        if (!response.ok) {
          throw new Error("HTTP " + response.status + " fetching scores.json");
        }
        return response.json();
      })
      .then(data => {
        populate_table('phase1-body', data.round1, true);
        populate_table('ctf-body', data.ctf, true);
        populate_table('combined-body', data.combined, false);
        if (data.generated_at) {
          document.getElementById('generated').textContent =
            "Generated " + data.generated_at;
        }
      })
      .catch(error => {
        console.error("Error loading scores:", error);
        document.getElementById('boards').style.display = 'none';
        const box = document.createElement('div');
        box.className = 'error dwr-panel dwr-note--error';
        box.innerHTML =
          "<strong>Failed to load scores.</strong><br><br>" +
          "Run <code>python scripts/final_leaderboard.py</code> to generate " +
          "<code>scores.json</code> next to this page.<br><br>" +
          "<small>" + String(error) + "</small>";
        document.body.appendChild(box);
      });

    function populate_table(tbodyId, teamData, hasRawData) {
      const tbody = document.getElementById(tbodyId);

      // A missing or empty section shouldn't take the whole page down with a
      // TypeError -- show the board empty and let the others render.
      if (!Array.isArray(teamData) || teamData.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = hasRawData ? 4 : 3;
        td.className = 'no-data';
        td.textContent = 'No data';
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }

      teamData.forEach((row, index) => {
        const tr = document.createElement('tr');

        // textContent, not innerHTML: team names come from CTFd accounts,
        // which are attacker-controlled in the general case.
        const rank = document.createElement('td');
        rank.className = 'rank';
        rank.textContent = '#' + (index + 1);
        tr.appendChild(rank);

        const name = document.createElement('td');
        name.className = 'team-name';
        name.textContent = row.team;
        tr.appendChild(name);

        if (hasRawData) {
          const raw = document.createElement('td');
          raw.textContent = row.raw_score;
          tr.appendChild(raw);

          const norm = document.createElement('td');
          norm.textContent = row.normalized;
          tr.appendChild(norm);
        } else {
          const score = document.createElement('td');
          score.className = 'final-score';
          score.textContent = row.score;
          tr.appendChild(score);
        }

        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
