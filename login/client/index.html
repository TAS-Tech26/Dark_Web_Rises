<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lobby</title>
    <style>
        /* Your existing CSS... */
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 8px; width: 450px; text-align: center; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: none; box-sizing: border-box;}
        input { background: #333; color: white; }
        button { background: #6366f1; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #4f46e5; }
        .secondary { background: #444; }
        #lobby_log { height: 200px; background: #000; overflow-y: auto; text-align: left; padding: 10px; font-size: 0.9em; margin-bottom: 10px; }
        .log-msg { margin-bottom: 5px; }
        .log-ready { color: #22c55e; font-weight: bold; }
        .log-unready { color: #ef4444; font-weight: bold; }
        
        /* NEW STYLES FOR THE GAME SCREEN */
        #game_image { width: 100%; height: auto; border-radius: 8px; margin-bottom: 15px; border: 2px solid #333;}
        #timer_display { font-size: 1.5em; font-weight: bold; color: #ef4444; margin-bottom: 10px; }
        .spectator-text { color: #888; font-style: italic; margin-bottom: 15px; }
        #leaderboard_list { text-align: left; background: #2c2c2c; padding: 15px; border-radius: 8px;}
    </style>
</head>
<body>

    <div class="card">
        <div id="login_screen">
            <h2>System Login</h2>
            <input type="text" id="username_input" placeholder="Username">
            <input type="password" id="password_input" placeholder="Password">
            <button id="login_button">Connect</button>
        </div>

        <div id="lobby_screen" style="display: none;">
            <h2 id="lobby_title">Team Lobby</h2>
            
            <div style="background: #2c2c2c; padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: left;">
                <h4 style="margin-top: 0; margin-bottom: 8px; color: #a0a0a0;">Active Roster:</h4>
                <ul id="roster_list" style="margin: 0; padding-left: 20px; color: #fff;"></ul>
            </div>

            <div id="lobby_log"></div>
            <button id="logout_button" class="secondary">Disconnect</button>
        </div>

        <div id="game_screen" style="display: none;">
            <h2 id="game_title">Live Match</h2>
            
            <img id="game_image" src="" alt="Waiting for image..." style="display: none;">
            
            <div id="timer_display">Waiting...</div>
            
            <div id="active_turn_controls" style="display: none;">
                <input type="text" id="prompt_input" placeholder="Describe the image...">
                <button id="submit_prompt_button">Submit Prompt</button>
            </div>
            
            <div id="spectator_message" class="spectator-text">Waiting for your turn...</div>
        </div>

        <div id="postgame_screen" style="display: none;">
            <h2>Match Results</h2>
            <div id="leaderboard_list"></div>
            <button id="return_lobby_button" class="secondary">Return to Lobby</button>
        </div>
    </div>

    <script type="module" src="ui_controller.js"></script>
</body>
</html>
