<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lobby</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 8px; width: 350px; text-align: center; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: none; box-sizing: border-box;}
        input { background: #333; color: white; }
        button { background: #6366f1; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #4f46e5; }
        .secondary { background: #444; }
        #lobby_log { height: 200px; background: #000; overflow-y: auto; text-align: left; padding: 10px; font-size: 0.9em; margin-bottom: 10px; }
        .log-msg { margin-bottom: 5px; }
        .log-ready { color: #22c55e; font-weight: bold; }
        .log-unready { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div id="login_screen">
            <h2>System Login</h2>
            <input type="text" id="username_input" placeholder="Username">
            <input type="password" id="password_input" placeholder="Password">
            <button id="login_button">Connect</button>
        </div>

        <div id="lobby_screen" style="display: none;">
            <h2 id="lobby_title">Team Lobby</h2>
            <div id="lobby_log"></div>
            <button id="logout_button" class="secondary">Disconnect</button>
        </div>
    </div>

    <script type="module" src="ui_controller.js"></script>
</body>
</html>
