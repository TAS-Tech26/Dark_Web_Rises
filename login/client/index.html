<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Client</title>
    <style>
        /* --- Modern CSS Reset & Base Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212; /* Sleek dark background */
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- The Main Card Container --- */
        .app-container {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            margin-bottom: 24px;
            color: #ffffff;
            font-weight: 600;
        }

        p {
            margin-bottom: 12px;
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        /* --- Inputs & Buttons --- */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            background-color: #2c2c2c;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #6366f1; /* Modern indigo accent */
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 12px;
        }

        button:hover {
            background-color: #4f46e5;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Secondary buttons (like Select Team) */
        button.secondary {
            background-color: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #3d3d3d;
        }
        button.secondary:hover {
            background-color: #3d3d3d;
        }

        /* --- Game Screen Specifics --- */
        #chat_box {
            height: 250px;
            background-color: #121212;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            margin-bottom: 16px;
            padding: 12px;
            overflow-y: auto;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-message {
            background-color: #2c2c2c;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="login_screen">
            <h2>Welcome Back</h2>
            <input type="text" id="username_input" placeholder="Username">
            <input type="password" id="password_input" placeholder="Password">
            <button id="login_button">Connect to Server</button>
        </div>

        <div id="team_init_screen" style="display: none;">
            <h2>Join the Fight</h2>
            <button id="team_create">Create a New Team</button>
            <button id="team_select" class="secondary">Join Existing Team</button>
        </div>

        <div id="create_team_screen" style="display: none;">
            <h2>Create Team</h2>
            <p>Rally your squad under a new banner.</p>
            <input type="text" id="create_team_name_input" placeholder="Enter Team Name">
            <button id="create_team_button">Confirm Creation</button>
        </div>

        <div id="select_team_screem" style="display: none;">
            <h2>Join Team</h2>
            <input type="text" id="select_team_name_input" placeholder="Enter Team Name">
            <button id="select_team_button">Request to Join</button>
        </div>

        <div id="game_screen" style="display: none;">
            <h2>Match Lobby</h2>
            <div id="chat_box">
                <div class="chat-message" style="color: #6366f1; font-weight: bold;">System: Connected to server.</div>
            </div>
            <input type="text" id="message_input" placeholder="Type a message...">
            <button id="send_button">Send Message</button>

            <button id="logout_button" class="secondary" style="margin-top: 12px;">Disconnect</button>
        </div>

    </div>

    <script type="module" src="login.js"></script>
    <script type="module" src="ui_controller.js"></script>
    
</body>
</html>
